<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAM-Market-Pro | Zambia's Number 1 Store</title>
    <style>
        :root { --primary: #27ae60; --dark: #1a1a1a; --gray: #f4f4f4; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--gray); margin: 0; padding-bottom: 60px; }
        
        /* Header */
        .header { background: var(--dark); padding: 15px; position: sticky; top: 0; z-index: 100; }
        .search-box { display: flex; background: white; border-radius: 8px; overflow: hidden; }
        .search-box input { border: none; padding: 12px; flex: 1; outline: none; }
        .search-box button { background: var(--primary); border: none; color: white; padding: 0 15px; font-weight: bold; }

        /* Categories */
        .categories { display: flex; overflow-x: auto; padding: 15px; gap: 15px; background: white; }
        .cat-item { text-align: center; min-width: 70px; }
        .cat-icon { width: 50px; height: 50px; background: #e8f5e9; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; margin: 0 auto 5px; }
        .cat-item span { font-size: 12px; color: #333; font-weight: 500; }

        /* Product Grid */
        .section-title { padding: 15px; font-size: 18px; font-weight: bold; color: var(--dark); }
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        .product-card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .product-img { width: 100%; height: 150px; background: #eee; display: flex; align-items: center; justify-content: center; color: #999; }
        .product-info { padding: 10px; }
        .price { color: var(--primary); font-weight: bold; font-size: 16px; margin: 5px 0; }
        .product-name { font-size: 14px; color: #444; height: 38px; overflow: hidden; }
        .buy-btn { width: 100%; background: var(--primary); color: white; border: none; padding: 8px; border-radius: 5px; margin-top: 10px; font-weight: bold; }

        /* Floating WhatsApp */
        .whatsapp-float { position: fixed; bottom: 80px; right: 20px; background: #25d366; color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); text-decoration: none; z-index: 1000; }
    </style>
</head>
<body>

    <div class="header">
        <div style="color: white; font-weight: bold; margin-bottom: 10px; font-size: 20px;">ZAM-Market-Pro</div>
        <div class="search-box">
            <input type="text" placeholder="I'm shopping for...">
            <button>Search</button>
        </div>
    </div>

    <div class="categories">
        <div class="cat-item"><div class="cat-icon">📱</div><span>Phones</span></div>
        <div class="cat-item"><div class="cat-icon">🚗</div><span>Cars</span></div>
        <div class="cat-item"><div class="cat-icon">👕</div><span>Fashion</span></div>
        <div class="cat-item"><div class="cat-icon">🏠</div><span>Property</span></div>
